# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: '/'
    weight: 10
  - name: Research
    url: '/research/'
    weight: 20
  - name: Awards
    url: '/awards/'
    weight: 30
  - name: Teaching
    url: '/teaching/'
    weight: 35
  - name: CV
    url: 'https://joeyetinghan.github.io/uploads/Tinghan_Ye_CV.pdf'
    weight: 38
  - name: Contact
    url: '/#contact'
    weight: 40

